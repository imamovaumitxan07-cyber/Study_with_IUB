<!DOCTYPE html>
<html lang="kaa" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F2A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBF5EC" media="(prefers-color-scheme: light)">
<meta name="description" content="Study with IUB — oqıw, izertlew, ózin tártipke salıw hám finanslıq sawatlılıq ushın bir platforma.">
<meta name="application-name" content="Study with IUB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study with IUB">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Study with IUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  /* DARK IMMERSIVE (default) */
  --bg:#060818; --bg-2:#0B0F2A; --surface:rgba(16,20,46,.74); --surface-solid:#11152F; --beige:rgba(255,255,255,.05); --beige-2:rgba(255,255,255,.1);
  --ink:#F1EEFF; --ink-2:#C9C4E6; --muted:#8E8AB4; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --pink:#FF7EB6; --green:#34E0A1; --amber:#FFC15E; --red:#FF7A85; --teal:#2EE6D6; --gold:#F5C55B;
  --pink-50:rgba(255,126,182,.14); --green-50:rgba(52,224,161,.14); --amber-50:rgba(255,193,94,.14); --red-50:rgba(255,122,133,.14);
  --r:18px; --r-sm:11px; --r-lg:26px;
  --sh:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -18px rgba(0,0,0,.7);
  --sh-lg:0 30px 80px -20px rgba(0,0,0,.75);
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --display:'Unbounded','Inter',system-ui,sans-serif;
  --serif:'Unbounded','Inter',sans-serif;
  --card-bg:linear-gradient(155deg,color-mix(in srgb,var(--a1) 10%,rgba(20,24,54,.82)) 0%,rgba(13,16,40,.82) 60%);
  --hero-bg:radial-gradient(900px 420px at 88% -10%,color-mix(in srgb,var(--a1) 55%,transparent),transparent 60%),radial-gradient(700px 380px at 0% 120%,color-mix(in srgb,var(--a2) 40%,transparent),transparent 60%),radial-gradient(500px 300px at 55% 60%,color-mix(in srgb,var(--a3) 22%,transparent),transparent 70%),linear-gradient(135deg,#0D1235,#090C24);
  --glow:0 0 0 1px color-mix(in srgb,var(--a1) 40%,transparent),0 24px 60px -18px color-mix(in srgb,var(--a1) 55%,transparent);
  --a1:#8B5CF6; --a2:#3B82F6; --a3:#EC4899;
  color-scheme:dark;
}
[data-theme="light"]{
  /* LIGHT LUXURY */
  --bg:#FBF5EC; --bg-2:#F6ECDD; --surface:rgba(255,252,247,.82); --surface-solid:#FFFCF7; --beige:#F4E9DA; --beige-2:#EADBC6;
  --ink:#251633; --ink-2:#4F3E5C; --muted:#857489; --line:rgba(90,60,40,.11); --line-2:rgba(90,60,40,.19);
  --pink:#D9467C; --green:#0E9F6E; --amber:#B7791F; --red:#D14343; --teal:#0F8F88; --gold:#B8862B;
  --pink-50:#FCE6EE; --green-50:#DDF5EA; --amber-50:#FBEFD9; --red-50:#FBE3E3;
  --sh:0 1px 0 rgba(255,255,255,.9) inset,0 14px 34px -16px color-mix(in srgb,var(--a1) 30%,rgba(80,50,30,.35));
  --sh-lg:0 30px 70px -24px color-mix(in srgb,var(--a1) 35%,rgba(80,50,30,.4));
  --card-bg:linear-gradient(160deg,rgba(255,255,255,.95) 0%,color-mix(in srgb,var(--a1) 7%,#FFF8EF) 100%);
  --hero-bg:radial-gradient(900px 420px at 90% -20%,color-mix(in srgb,var(--a1) 30%,transparent),transparent 62%),radial-gradient(700px 360px at -5% 120%,color-mix(in srgb,var(--a2) 26%,transparent),transparent 60%),radial-gradient(520px 300px at 60% 70%,color-mix(in srgb,var(--a3) 18%,transparent),transparent 70%),linear-gradient(135deg,#FFF9F1,#F8EDE0);
  --glow:0 0 0 1px color-mix(in srgb,var(--a1) 35%,transparent),0 24px 50px -20px color-mix(in srgb,var(--a1) 45%,transparent);
  color-scheme:light;
}
/* ===== module identities (dark) ===== */
body[data-mod="dashboard"],body[data-mod="vision"],body[data-mod="profile"],body[data-mod="prefs"],body[data-mod="help"]{--a1:#8B5CF6;--a2:#3B82F6;--a3:#22D3EE}
body[data-mod="academic"]{--a1:#3B82F6;--a2:#22D3EE;--a3:#6366F1}
body[data-mod="student"]{--a1:#FB7185;--a2:#FDBA74;--a3:#C084FC}
body[data-mod="teacher"]{--a1:#10B981;--a2:#2DD4BF;--a3:#F5C55B}
body[data-mod="research"],body[data-mod="journals"]{--a1:#6366F1;--a2:#3B82F6;--a3:#E879F9}
body[data-mod="library"]{--a1:#F59E0B;--a2:#D97757;--a3:#FCD9A0}
body[data-mod="tools"],body[data-mod="prompts"]{--a1:#A855F7;--a2:#22D3EE;--a3:#EC4899}
body[data-mod="discipline"]{--a1:#10B981;--a2:#2DD4BF;--a3:#A78BFA}
body[data-mod="money"]{--a1:#10B981;--a2:#F5B83D;--a3:#8B5CF6}
body[data-mod="opportunities"]{--a1:#3B82F6;--a2:#38BDF8;--a3:#FB7185}
body[data-mod="academy"]{--a1:#A855F7;--a2:#EC4899;--a3:#6366F1}
body[data-mod="templates"]{--a1:#FB7185;--a2:#FB923C;--a3:#A78BFA}
body[data-mod="productivity"]{--a1:#3B82F6;--a2:#2DD4BF;--a3:#8B5CF6}
body[data-mod="community"]{--a1:#FB7185;--a2:#EC4899;--a3:#6366F1}
body[data-mod="premium"],body[data-mod="admin"]{--a1:#F5B83D;--a2:#A855F7;--a3:#FB7185}
/* ===== module identities (light: deeper shades for contrast) ===== */
[data-theme="light"] body[data-mod="dashboard"],[data-theme="light"] body[data-mod="vision"],[data-theme="light"] body[data-mod="profile"],[data-theme="light"] body[data-mod="prefs"],[data-theme="light"] body[data-mod="help"]{--a1:#6D28D9;--a2:#2563EB;--a3:#0891B2}
[data-theme="light"] body[data-mod="academic"]{--a1:#1D4ED8;--a2:#0891B2;--a3:#4F46E5}
[data-theme="light"] body[data-mod="student"]{--a1:#E11D48;--a2:#EA580C;--a3:#9333EA}
[data-theme="light"] body[data-mod="teacher"]{--a1:#047857;--a2:#0F766E;--a3:#B7791F}
[data-theme="light"] body[data-mod="research"],[data-theme="light"] body[data-mod="journals"]{--a1:#4338CA;--a2:#1D4ED8;--a3:#A21CAF}
[data-theme="light"] body[data-mod="library"]{--a1:#B45309;--a2:#9A3412;--a3:#CA8A04}
[data-theme="light"] body[data-mod="tools"],[data-theme="light"] body[data-mod="prompts"]{--a1:#7E22CE;--a2:#0E7490;--a3:#BE185D}
[data-theme="light"] body[data-mod="discipline"]{--a1:#047857;--a2:#0F766E;--a3:#7C3AED}
[data-theme="light"] body[data-mod="money"]{--a1:#047857;--a2:#B7791F;--a3:#6D28D9}
[data-theme="light"] body[data-mod="opportunities"]{--a1:#1D4ED8;--a2:#0369A1;--a3:#E11D48}
[data-theme="light"] body[data-mod="academy"]{--a1:#7E22CE;--a2:#BE185D;--a3:#4338CA}
[data-theme="light"] body[data-mod="templates"]{--a1:#E11D48;--a2:#C2410C;--a3:#7C3AED}
[data-theme="light"] body[data-mod="productivity"]{--a1:#1D4ED8;--a2:#0F766E;--a3:#6D28D9}
[data-theme="light"] body[data-mod="community"]{--a1:#E11D48;--a2:#BE185D;--a3:#4338CA}
[data-theme="light"] body[data-mod="premium"],[data-theme="light"] body[data-mod="admin"]{--a1:#B7791F;--a2:#7E22CE;--a3:#E11D48}
body{--lav:var(--a1);--lav-600:color-mix(in srgb,var(--a1) 75%,var(--ink));--lav-50:color-mix(in srgb,var(--a1) 14%,transparent);--lav-100:color-mix(in srgb,var(--a1) 30%,transparent)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);transition:background .3s;color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--lav-600);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.02em}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.xs{font-size:11.5px}

/* layout */
.app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,rgba(142,124,255,.06),transparent 40%),var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-name{font-weight:700;letter-spacing:.06em;font-size:13.5px}
.brand-tag{font-size:11px;color:var(--muted);letter-spacing:.01em}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:14px 10px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--ink-2);font-weight:500;border:0;background:none;width:100%;text-align:left;font-size:13.5px}
.nav-item:hover{background:var(--beige);text-decoration:none}
.nav-item.active{background:var(--lav-50);color:var(--lav-600)}
.nav-item svg{flex:none;opacity:.85}
.nav-item .pill{margin-left:auto}
.side-foot{margin-top:auto;padding-top:14px}
.upgrade-card{background:linear-gradient(160deg,var(--lav-50),var(--pink-50));border:1px solid var(--lav-100);border-radius:var(--r);padding:14px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);outline:none}
.search input:focus{border-color:var(--lav);box-shadow:0 0 0 3px var(--lav-50)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-lg);max-height:420px;overflow:auto;padding:6px;display:none}
.search-results.open{display:block}
.sr-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.sr-item:hover{background:var(--beige)}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--lav);color:var(--lav-600)}
.dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--pink);border:2px solid var(--surface)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--lav),var(--pink));color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.content{padding:26px 28px 60px;max-width:1360px;width:100%;margin:0 auto}
.demo-banner{display:flex;align-items:center;gap:8px;background:var(--amber-50);color:var(--amber);border-bottom:1px solid var(--line);padding:6px 28px;font-size:12.5px}
.menu-btn{display:none}

/* components */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin-top:6px;max-width:720px;font-size:14.5px}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--lav-600);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent),var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card.flat{box-shadow:none}
.card.beige{background:var(--beige);border-color:var(--beige-2);box-shadow:none}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.span2{grid-column:span 2}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:13.5px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--lav);color:var(--lav-600);text-decoration:none}
.btn.primary{background:linear-gradient(135deg,var(--lav),#6A5AE0);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(142,124,255,.28)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.lav{background:var(--lav);border-color:var(--lav);color:#fff}
.btn.lav:hover{background:var(--lav-600);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--beige)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fav{border:0;background:none;color:var(--muted);padding:4px;border-radius:6px;display:grid;place-items:center}
.fav:hover{color:var(--pink);background:var(--pink-50)}
.fav.on{color:var(--pink)}
.fav.on svg{fill:currentColor}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--beige);color:var(--ink-2);white-space:nowrap}
.pill.lav{background:var(--lav-50);color:var(--lav-600)}
.pill.pink{background:var(--pink-50);color:var(--pink)}
.pill.green{background:var(--green-50);color:var(--green)}
.pill.amber{background:var(--amber-50);color:var(--amber)}
.pill.red{background:var(--red-50);color:var(--red)}
.pill.dark{background:var(--ink);color:var(--bg)}
.demo-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:var(--amber-50);border:1px solid var(--line);padding:1px 7px;border-radius:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tab{padding:9px 14px;border:0;background:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--lav)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2)}
.chip:hover{border-color:var(--lav)}
.chip.active{background:var(--lav);border-color:var(--lav);color:#fff}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.input,.select,.textarea{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--lav);box-shadow:0 0 0 3px var(--lav-50)}
.textarea{min-height:84px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .input,.toolbar .select{width:auto}
.toolbar .grow{flex:1;min-width:200px}
.progress{height:8px;border-radius:99px;background:var(--beige-2);overflow:hidden}
.progress>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lav),var(--pink));transition:width .4s}
.progress.green>span{background:var(--green)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat .l{font-size:12.5px;color:var(--muted)}
.ico-box{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--lav-50);color:var(--lav-600);flex:none}
.ico-box.pink{background:var(--pink-50);color:var(--pink)}
.ico-box.beige{background:var(--beige);color:var(--ink-2)}
.ico-box.green{background:var(--green-50);color:var(--green)}
.ico-box.amber{background:var(--amber-50);color:var(--amber)}
.ico-box.lg{width:46px;height:46px;border-radius:13px}
.tool-logo{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:none}
.hover-card{transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer}
.hover-card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);border-color:var(--lav-100)}
.quick{display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.check{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line-2);background:var(--surface);display:grid;place-items:center;flex:none;padding:0;color:#fff}
.check.on{background:var(--lav);border-color:var(--lav)}
.done-text{text-decoration:line-through;color:var(--muted)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--ink)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:var(--lav-50)}
.tbl input.cell{width:58px;padding:5px 6px;border:1px solid var(--line-2);border-radius:7px;text-align:center}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ico-box{margin:0 auto 12px}
.warn{display:flex;gap:12px;align-items:flex-start;background:var(--amber-50);border:1px solid var(--line);color:var(--ink-2);border-radius:var(--r);padding:14px 16px}
.info{display:flex;gap:12px;align-items:flex-start;background:var(--lav-50);border:1px solid var(--lav-100);color:var(--ink-2);border-radius:var(--r);padding:14px 16px}
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:28px 30px;background:var(--hero-grad),var(--surface);border:1px solid var(--line);box-shadow:var(--sh)}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,var(--lav-100),transparent 70%);pointer-events:none}
.hero::before{content:"";position:absolute;right:120px;bottom:-140px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,var(--pink-50),transparent 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.kbd{font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface)}
.prompt-box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;color:var(--ink-2);max-height:180px;overflow:auto}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.step{flex:1;min-width:150px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:center}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12.5px;background:var(--beige);flex:none}
.step.active{border-color:var(--lav);box-shadow:0 0 0 3px var(--lav-50)}
.step.active .n{background:var(--lav);color:#fff}
.step.done .n{background:var(--green-50);color:var(--green)}
.timer{font-family:var(--serif);font-size:76px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ring{position:relative;width:240px;height:240px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{aspect-ratio:1.15;border-radius:9px;border:1px solid var(--line);padding:5px 6px;font-size:12px;position:relative;background:var(--surface)}
.cal .d.today{border-color:var(--lav);background:var(--lav-50)}
.cal .d.out{opacity:.35}
.cal .d .ev{display:block;margin-top:3px;font-size:10px;line-height:1.2;padding:2px 4px;border-radius:4px;background:var(--pink-50);color:var(--pink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding:4px 0}
.habit-cell{width:26px;height:26px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);padding:0}
.habit-cell.on{background:var(--lav);border-color:var(--lav)}
.price{font-size:34px;font-weight:600;letter-spacing:-.03em}
.plan{display:flex;flex-direction:column;gap:14px}
.plan.featured{border-color:var(--lav);box-shadow:0 0 0 3px var(--lav-50),var(--sh-lg)}
.feat{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.feat svg{color:var(--green);flex:none;margin-top:2px}
.slide{min-height:420px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-lg);padding:44px 52px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.slide.dark{background:radial-gradient(900px 400px at 90% -10%,rgba(142,124,255,.35),transparent 60%),#0A0C1A;color:#F5F1EA;border-color:rgba(255,255,255,.08)}
.slide.dark .muted{color:#B8B2C2}
.slide h2.big{font-family:var(--serif);font-size:40px;letter-spacing:-.02em;line-height:1.1;font-weight:600}
.slide-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px}
.dots{display:flex;gap:6px}
.dots button{width:8px;height:8px;border-radius:50%;border:0;background:var(--line-2);padding:0}
.dots button.on{background:var(--lav);width:22px;border-radius:5px}
.thumb{height:120px;border-radius:10px;background:var(--beige);position:relative;overflow:hidden;margin-bottom:12px;display:grid;place-items:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sep{height:1px;background:var(--line);margin:14px 0}
.cmp td,.cmp th{text-align:center}
.cmp td:first-child,.cmp th:first-child{text-align:left}
.post{display:flex;gap:12px}
.vote{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px}
details.faq{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 16px}
details.faq+details.faq{margin-top:8px}
details.faq summary{color:var(--ink);cursor:pointer;padding:14px 0;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.faq summary::-webkit-details-marker{display:none}
details.faq[open] summary svg{transform:rotate(180deg)}
details.faq .a{padding:0 0 14px;color:var(--ink-2)}

/* modal / toast / drawer */
.overlay{position:fixed;inset:0;background:rgba(5,6,15,.6);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.overlay.open{display:flex;animation:fade .15s}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;max-width:640px;padding:24px;animation:pop .18s}
.modal.wide{max-width:880px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--sh-lg);font-size:13px;display:flex;align-items:center;gap:8px;animation:pop .2s}
.popover{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-lg);min-width:220px;padding:6px;z-index:50;display:none}
.popover.open{display:block}
.pop-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;font-size:13px}
.pop-item:hover{background:var(--beige)}
.pop-item.active{color:var(--lav-600);font-weight:600}
.rel{position:relative}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.view{animation:fade .2s}
.scrim{display:none}

/* responsive */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--sh-lg)}
  .sidebar.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(35,33,43,.3);z-index:35}
  .menu-btn{display:grid}
  .topbar{padding:10px 16px}
  .content{padding:20px 16px 50px}
  .demo-banner{padding:6px 16px}
  .g2,.g3{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .hide-m{display:none!important}
  h1{font-size:25px}
  .slide{padding:30px 24px;min-height:380px}
  .slide h2.big{font-size:30px}
}
@media (max-width:560px){.g4{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.timer{font-size:58px}.ring{width:210px;height:210px}.hero{padding:22px 20px}}

/* ===== v2 additions ===== */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--green);box-shadow:0 0 0 3px var(--green-50)}
.sync.busy i{background:var(--amber);animation:pulse 1s infinite}
.sync.local i{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.input,.select,.textarea,.search input,.tbl input.cell{background:var(--bg);color:var(--ink)}
select option{background:var(--surface);color:var(--ink)}
.flash-wrap{perspective:1200px;max-width:560px;margin:0 auto}
.flash{position:relative;height:280px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.flash.flipped{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-lg);border:1px solid var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;font-size:19px;line-height:1.45;background:radial-gradient(500px 200px at 50% 0,var(--lav-50),transparent),var(--surface);box-shadow:var(--sh-lg)}
.flash .back{transform:rotateY(180deg);background:radial-gradient(500px 200px at 50% 100%,var(--green-50),transparent),var(--surface);font-size:16px}
.chat{display:flex;flex-direction:column;gap:12px;max-height:460px;overflow:auto;padding:4px}
.bubble{max-width:85%;padding:11px 14px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;line-height:1.55}
.bubble.me{align-self:flex-end;background:var(--lav);color:#fff;border-bottom-right-radius:4px}
.bubble.ai{align-self:flex-start;background:var(--beige);border:1px solid var(--line);border-bottom-left-radius:4px}
.src{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--lav-50);color:var(--lav-600);margin:2px 3px 0 0;cursor:pointer;border:0}
.ai-out{white-space:pre-wrap;line-height:1.65;font-size:14px}
.ai-out h4{margin:12px 0 4px;font-size:14.5px}
.jar{position:relative;width:120px;height:150px;margin:0 auto}
.jar svg{overflow:visible}
.jar .liquid{transition:y 1s cubic-bezier(.2,.8,.2,1),height 1s cubic-bezier(.2,.8,.2,1)}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.heat span{aspect-ratio:1;border-radius:3px;background:var(--beige)}
.heat span.l1{background:rgba(142,124,255,.35)}.heat span.l2{background:rgba(142,124,255,.65)}.heat span.l3{background:var(--lav)}
.mood{display:flex;gap:6px}.mood button{font-size:20px;width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);padding:0}
.mood button.on{border-color:var(--lav);background:var(--lav-50)}
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--lav-50),transparent 70%)}
.bottom-nav{display:none}
.mm text{font-family:var(--font)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--lav);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;transition:.2s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--lav);background:var(--lav-50)}
.widget-tools{display:flex;gap:2px}
.grad-text{background:linear-gradient(90deg,var(--ink),var(--lav-600));-webkit-background-clip:text;background-clip:text;color:transparent}
@media (max-width:900px){
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0;text-decoration:none}
  .bottom-nav a.active{color:var(--lav-600)}
  .content{padding-bottom:90px}
  .sync span{display:none}
}

/* ===================== v3 DESIGN SYSTEM ===================== */
html{background:var(--bg)}
body{background:transparent;transition:color .4s}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 700px at 70% -10%,var(--bg-2),var(--bg) 70%);pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 26s ease-in-out infinite alternate;transition:background 1s}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:var(--a1)}
.aurora i:nth-child(2){width:38vw;height:38vw;right:-8vw;top:18vh;background:var(--a2);animation-delay:-8s;opacity:.38}
.aurora i:nth-child(3){width:34vw;height:34vw;left:30vw;bottom:-18vw;background:var(--a3);animation-delay:-15s;opacity:.32}
[data-theme="light"] .aurora{background:linear-gradient(160deg,#FFF9F2 0%,#F8EEE2 55%,#F3E6F2 100%)}
[data-theme="light"] .aurora i{opacity:.22;filter:blur(110px)}
.aurora::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(180deg,#000,transparent 70%)}
[data-theme="light"] .aurora::after{background-image:radial-gradient(rgba(120,80,40,.07) 1px,transparent 1px)}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,4vh) scale(1.12)}100%{transform:translate(-4vw,8vh) scale(.95)}}
h1,h2,.display{font-family:var(--display);letter-spacing:-.02em}
h1{font-weight:600}
h2{font-size:17px;font-weight:600}
.card{background:var(--card-bg);border:1px solid var(--line);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.card.flat{backdrop-filter:none}
.card.beige{background:var(--beige);border-color:var(--line)}
.hover-card:hover,.quick:hover{transform:translateY(-4px);box-shadow:var(--glow);border-color:color-mix(in srgb,var(--a1) 40%,transparent)}
.quick{background:var(--card-bg);border-color:var(--line);backdrop-filter:blur(14px);position:relative;overflow:hidden}
.quick::after{content:"";position:absolute;right:-30px;bottom:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a1) 30%,transparent),transparent 70%);transition:transform .5s}
.quick:hover::after{transform:scale(1.6)}
.sidebar{background:linear-gradient(180deg,color-mix(in srgb,var(--a1) 12%,transparent),transparent 45%),color-mix(in srgb,var(--surface-solid) 86%,transparent);backdrop-filter:blur(20px);border-right:1px solid var(--line)}
.topbar{background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(18px) saturate(150%)}
.nav-item{padding:6px 8px;gap:10px}
.nav-tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 92%,#fff),color-mix(in srgb,var(--c) 70%,#000));box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -2px 0 rgba(0,0,0,.18) inset,0 6px 14px -6px var(--c);transition:transform .3s}
.nav-tile svg{opacity:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.nav-item:hover .nav-tile{transform:translateY(-1px) rotate(-4deg) scale(1.06)}
.nav-item.active{background:linear-gradient(90deg,color-mix(in srgb,var(--a1) 22%,transparent),transparent);color:var(--ink);box-shadow:inset 3px 0 0 var(--a1)}
.btn.primary{background:linear-gradient(135deg,var(--a1),color-mix(in srgb,var(--a1) 55%,var(--a2)));border-color:transparent;color:#fff;box-shadow:0 10px 24px -10px var(--a1)}
.btn:active,.chip:active,.quick:active{transform:scale(.97)}
.chip.active{background:linear-gradient(135deg,var(--a1),color-mix(in srgb,var(--a1) 60%,var(--a2)));border-color:transparent;color:#fff}
.tab.active{border-bottom-color:var(--a1);color:var(--ink)}
.tabs{gap:6px;border-bottom:0;background:color-mix(in srgb,var(--surface-solid) 60%,transparent);padding:5px;border-radius:14px;border:1px solid var(--line);display:inline-flex;max-width:100%}
.tab{border-radius:10px;border-bottom:0;margin:0;padding:8px 13px}
.tab.active{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 85%,#fff 0%),color-mix(in srgb,var(--a1) 60%,var(--a2)));color:#fff;box-shadow:0 8px 20px -10px var(--a1)}
.ico-box{background:linear-gradient(145deg,color-mix(in srgb,var(--a1) 30%,transparent),color-mix(in srgb,var(--a1) 12%,transparent));color:color-mix(in srgb,var(--a1) 70%,var(--ink));box-shadow:0 1px 0 rgba(255,255,255,.15) inset}
.progress{background:color-mix(in srgb,var(--ink) 9%,transparent);height:9px}
.progress>span{background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:0 0 14px -2px var(--a1);transform-origin:left;animation:growx .9s cubic-bezier(.2,.8,.2,1) both}
.progress.green>span{background:linear-gradient(90deg,var(--green),var(--teal))}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.input,.select,.textarea,.search input,.tbl input.cell{background:color-mix(in srgb,var(--surface-solid) 85%,transparent)}
.tbl-wrap{background:var(--card-bg);backdrop-filter:blur(14px)}
.tbl th{background:color-mix(in srgb,var(--a1) 8%,transparent)}
.modal{background:var(--surface-solid);border:1px solid var(--line-2);animation:modalIn .35s cubic-bezier(.2,.9,.2,1.1)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.dot{animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pink) 70%,transparent)}80%{box-shadow:0 0 0 8px transparent}}
.stat .v{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.num{font-variant-numeric:tabular-nums}
/* ---------- module hero ---------- */
.mhero{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.85fr);gap:12px;align-items:center;border-radius:var(--r-lg);padding:30px 34px;margin-bottom:22px;background:var(--hero-bg);border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh-lg);isolation:isolate}
.mhero::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);transform:translateX(-100%);animation:sheen 7s ease-in-out infinite;z-index:-1}
@keyframes sheen{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.mhero h1{font-size:clamp(24px,3vw,36px);line-height:1.12;margin:6px 0 8px;background:linear-gradient(100deg,var(--ink) 30%,color-mix(in srgb,var(--a1) 55%,var(--ink)) 70%,color-mix(in srgb,var(--a2) 60%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
.mhero .sub{color:var(--ink-2);font-size:15px;max-width:620px}
.mhero .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;background:color-mix(in srgb,var(--a1) 16%,transparent);border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);color:color-mix(in srgb,var(--a1) 55%,var(--ink));letter-spacing:.08em}
.mhero .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.illu{position:relative;height:230px;display:grid;place-items:center;perspective:900px}
.illu svg{width:100%;max-width:340px;height:auto;overflow:visible;filter:drop-shadow(0 30px 40px rgba(0,0,0,.35))}
[data-theme="light"] .illu svg{filter:drop-shadow(0 26px 30px color-mix(in srgb,var(--a1) 30%,rgba(80,50,30,.25)))}
.illu .layer{transition:transform .25s ease-out;will-change:transform}
.fl{animation:float 6s ease-in-out infinite}
.fl2{animation:float 7.5s ease-in-out infinite -2s}
.fl3{animation:float 5.2s ease-in-out infinite -3.5s}
.spinS{animation:spin 26s linear infinite;transform-box:fill-box;transform-origin:center}
.pulseS{animation:pulseS 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseS{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
/* dashboard hero */
.dhero{position:relative;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.8fr);gap:10px;border-radius:30px;padding:34px 36px;margin-bottom:22px;background:var(--hero-bg);border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh-lg);isolation:isolate}
.dhero h1{font-size:clamp(26px,3.2vw,40px);line-height:1.1}
.rings{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.ring-stat{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:18px;background:color-mix(in srgb,var(--surface-solid) 55%,transparent);border:1px solid var(--line);backdrop-filter:blur(10px)}
.ring-stat svg circle.fg{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring-stat b{font-family:var(--display);font-size:20px;display:block;line-height:1}
#hero3d{position:relative;min-height:260px}
#hero3d canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.bento>div:nth-child(1){grid-column:span 2}
.bento>div:nth-child(5){grid-row:span 1}
/* entrance */
.view.enter>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.06s}.view.enter>*:nth-child(3){animation-delay:.12s}.view.enter>*:nth-child(4){animation-delay:.18s}.view.enter>*:nth-child(5){animation-delay:.24s}.view.enter>*:nth-child(n+6){animation-delay:.3s}

let _saveT = null, _writing = false, _again = false;
function setSync(st, err = '') { CLOUD.status = st; CLOUD.err = err; const el = document.getElementById('syncBadge'); if (el) el.outerHTML = syncBadge(); }
function syncBadge() {
  const m = { ok: ['ok', 'Bultta saqlandı'], busy: ['busy', 'Saqlanıwda…'], init: ['busy', 'Jalǵanıwda…'], local: ['local', 'Tek usı brauzerde'], err: ['local', 'Saqlaw qátesi'] }[CLOUD.status] || ['local', '—'];

}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { storageOK = false; }

}
async function flush() {
  if (!CLOUD.uid) return;

  _writing = true;
  try {
    const body = JSON.parse(JSON.stringify(S)); body._v = 2; body._at = Date.now();
    const size = JSON.stringify(body).length;
    if (size > 240000) toast('Maǵlıwmat kólemi shegarasına jaqın — eski jazıwlardı arxivleń', 'alert');
    await CLOUD.db.doc(`data/users/${CLOUD.uid}/state`).set(body);
    setSync('ok');
  } catch (e) { setSync('err', (e && (e.message || e.code)) || 'qáte'); }

  if (_again) { _again = false; flush(); }
}

function load() {

function migrate(st) { const d = defaultState(); for (const k of Object.keys(d)) if (st[k] === undefined) st[k] = d[k]; for (const k of ['favs', 'settings', 'money']) st[k] = Object.assign({}, d[k], st[k] || {}); st.favs = Object.assign({ tools: [], prompts: [], opps: [], templates: [], lib: [], docs: [] }, st.favs); return st; }
async function initCloud() {
  if (typeof claude === 'undefined' || !claude || !claude.use) { setSync('local'); rerender(); return; }
  let db, user;
  try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch (e) {}
  claude.use('sample').then(x => { CLOUD.sample = x; if (current === 'academic' || current === 'discipline') rerender(); }).catch(() => {});
  claude.use('downloads').then(x => { CLOUD.downloads = x; }).catch(() => {});
  if (!db || !user) { setSync('local'); rerender(); return; }
  let uid = null; try { uid = await user.id(); } catch (e) {}
  if (!uid) { setSync('local'); rerender(); return; }
  CLOUD.db = db; CLOUD.user = user; CLOUD.uid = uid;
  try { CLOUD.owner = !!(await user.isOwner()); } catch (e) {}
  try { const me = await user.me(); CLOUD.name = (me && me.name) || ''; } catch (e) {}
  try {
    const sn = await withTimeout(db.doc(`data/users/${uid}/state`).get());
    if (sn.exists) { const lang = S.lang; S = migrate(Object.assign(defaultState(), JSON.parse(JSON.stringify(sn.data())))); if (!S.lang) S.lang = lang; try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} setSync('ok'); }
    else { if (CLOUD.name && S.name === defaultState().name) S.name = CLOUD.name; await flush(); }
  } catch (e) { setSync('err', e.message || e.code); }
  sharedInit();
  rerender();
}

function barChart(data, { h = 170, color = 'url(#barG)', color2 = 'color-mix(in srgb,var(--a1) 26%,transparent)', max } = {}) {
  const w = 100 / data.length, m = max || Math.max(...data.map(d => d.v)) * 1.15 || 1;
  const bars = data.map((d, i) => {
    const bh = (d.v / m) * (h - 26);
    return `<g><rect x="${i * w + w * .22}%" y="${h - 20 - bh}" width="${w * .56}%" height="${bh}" rx="6" style="fill:${d.hi ? color : color2};transform-origin:bottom;transform-box:fill-box;animation:growy .8s cubic-bezier(.2,.8,.2,1) ${i * 45}ms both"><title>${esc(d.l)}: ${d.v}</title></rect>
      <text x="${i * w + w / 2}%" y="${h - 4}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${esc(d.l)}</text>
      <text x="${i * w + w / 2}%" y="${h - 26 - bh}" text-anchor="middle" font-size="10.5" style="fill:var(--ink-2)" font-weight="600">${d.v}</text></g>`;
  }).join('');
  return `<svg width="100%" height="${h}" role="img"><defs><linearGradient id="barG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--a2)"/><stop offset="1" style="stop-color:var(--a1)"/></linearGradient></defs>${bars}</svg>`;
}
function lineChart(series, labels, { h = 180, w = 560 } = {}) {
  const all = series.flatMap(s => s.d), mx = Math.max(...all, 1) * 1.12, mn = 0, pad = 26;
  const X = i => pad + (i * (w - pad * 2)) / (labels.length - 1), Y = v => h - 22 - ((v - mn) / (mx - mn)) * (h - 40);
  const grid = [0, .25, .5, .75, 1].map(t => `<line x1="${pad}" x2="${w - pad}" y1="${Y(mx * t / 1.12)}" y2="${Y(mx * t / 1.12)}" style="stroke:var(--line-2)" stroke-dasharray="3 4"/>`).join('');
  const lines = series.map(s => {
    const p = s.d.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
    const area = `${X(0)},${h - 22} ${p} ${X(s.d.length - 1)},${h - 22}`;
    return `${s.fill ? `<polygon points="${area}" style="fill:${s.c}" opacity=".12"/>` : ''}<polyline points="${p}" fill="none" style="stroke:${s.c};stroke-dasharray:2000;stroke-dashoffset:2000;animation:dash 1.6s cubic-bezier(.2,.8,.2,1) forwards" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>` +
      s.d.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="3.4" style="fill:var(--surface-solid);stroke:${s.c}" stroke-width="2"><title>${s.n}: ${v}</title></circle>`).join('');
  }).join('');
  const xl = labels.map((l, i) => `<text x="${X(i)}" y="${h - 4}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${esc(l)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" style="overflow:visible">${grid}${lines}${xl}</svg>`;
}
function donut(parts, { size = 170, stroke = 22, center = '' } = {}) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, tot = parts.reduce((a, p) => a + p.v, 0); let off = 0;
  const segs = parts.map(p => { const len = (p.v / tot) * C; const s = `<circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" style="stroke:${p.c}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${len - 2} ${C - len + 2}" stroke-dashoffset="${-off}"><title>${esc(p.l)}: ${p.v}%</title></circle>`; off += len; return s; }).join('');
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:none"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" style="stroke:var(--beige)" stroke-width="${stroke}"/>${segs}</svg><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">${center}</div></div>`;
}

function render() {
  const ae = document.activeElement, aid = ae && ae.id && ae.closest('#content') ? ae.id : null;
  const sel = aid && 'selectionStart' in ae ? [ae.selectionStart, ae.selectionEnd] : null;
  const sy = window.scrollY;
  document.documentElement.lang = S.lang;
  $('#demoBanner').innerHTML = `${ic('info', 14)} <span>${esc(T('demo_banner'))}</span>${storageOK ? '' : ' <b>localStorage mavjud emas — o\'zgarishlar sahifa yangilanganda yo\'qoladi.</b>'}`;
  renderSidebar(); renderTopbar();
  const v = VIEWS[current] || VIEWS.dashboard;
  $('#content').innerHTML = `<div class="view">${v()}</div>`;
  if (UI.keepScroll) window.scrollTo(0, sy);
  UI.keepScroll = false;
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  if (VIEWS[current] && VIEWS[current].after) VIEWS[current].after();
}
const rerender = () => { UI.keepScroll = true; render(); };

function go(v, push = true) {
  if (!VIEWS[v]) v = 'dashboard';
  current = v; closeMenu();
  if (push && location.hash !== '#' + v) { history.replaceState(null, '', '#' + v); }
  render(); window.scrollTo(0, 0);
}

/* assessment generator (template-based demo) */
function genAssessment(type, topic, n) {
  topic = topic || 'Mavzu'; const out = [];
  const mcqT = [[`"${topic}" tushunchasining asosiy mohiyati nimada?`,['To\'g\'ri ta\'rif (o\'qituvchi to\'ldiradi)','Yaqin, lekin noto\'liq ta\'rif','Boshqa tushunchaga tegishli ta\'rif','Umumiy noto\'g\'ri tasavvur']],[`Quyidagilardan qaysi biri "${topic}"ga ta'sir qiluvchi omil EMAS?`,['Aloqasiz omil (to\'g\'ri javob)','Asosiy omil 1','Asosiy omil 2','Asosiy omil 3']],[`"${topic}" bo'yicha qaysi misol O'zbekiston kontekstiga eng mos?`,['Mahalliy amaliy misol (to\'g\'ri)','Xorijiy, kontekstga mos kelmaydigan misol','Nazariy, amaliy bo\'lmagan misol','Noto\'g\'ri talqin']],[`"${topic}"ni o'lchashda qaysi ko'rsatkich qo'llaniladi?`,['Asosiy ko\'rsatkich (to\'g\'ri)','Ikkilamchi ko\'rsatkich','Boshqa sohaga oid ko\'rsatkich','Mavjud bo\'lmagan ko\'rsatkich']],[`"${topic}" rivojlanishining birinchi bosqichi qaysi?`,['Birinchi bosqich (to\'g\'ri)','Uchinchi bosqich','Yakuniy bosqich','Bosqichga aloqasi yo\'q']]];
  const openT = [`"${topic}" tushunchasini o'z so'zlaringiz bilan izohlang va bitta mahalliy misol keltiring.`,`"${topic}"ning afzallik va kamchiliklarini solishtiring.`,`Qoraqalpog'iston yoki Nukus misolida "${topic}"ni qo'llash bo'yicha 3 ta taklif bering.`,`"${topic}" bo'yicha so'nggi tendensiyalarni tahlil qiling.`,`Agar siz rahbar bo'lsangiz, "${topic}" bo'yicha qanday qaror qabul qilardingiz? Asoslang.`];
  const tfT = [`"${topic}" faqat nazariy ahamiyatga ega.`,`"${topic}" iqtisodiy samaradorlikka ta'sir qiladi.`,`"${topic}"ni o'lchashning yagona usuli mavjud.`,`"${topic}" mahalliy kontekstda moslashtirilishi kerak.`,`"${topic}" boshqa omillardan mustaqil.`];
  const tfA = ['Yolg\'on','Rost','Yolg\'on','Rost','Yolg\'on'];
  for (let i = 0; i < n; i++) {
    if (type === 'mcq') { const [q, o] = mcqT[i % 5]; out.push(`${i + 1}. ${q}\n   A) ${o[0]}\n   B) ${o[1]}\n   C) ${o[2]}\n   D) ${o[3]}`); }
    if (type === 'open') out.push(`${i + 1}. ${openT[i % 5]}`);
    if (type === 'tf') out.push(`${i + 1}. ${tfT[i % 5]}  — Rost / Yolg'on`);
  }
  let key = '';
  if (type === 'mcq') key = '\n\nJAVOBLAR KALITI:\n' + Array.from({ length: n }, (_, i) => `${i + 1}-A`).join(', ') + '\n(Eslatma: variantlarni aralashtirib, mazmunini to\'ldiring.)';
  if (type === 'tf') key = '\n\nJAVOBLAR KALITI:\n' + Array.from({ length: n }, (_, i) => `${i + 1} — ${tfA[i % 5]}`).join('\n');
  if (type === 'open') key = '\n\nBAHOLASH: har bir savol 5 ball — mazmun (2), dalillar (2), til (1).';
  if (type === 'rubric') return `BAHOLASH RUBRIKASI: "${topic}" (namunaviy)\n\nMezon        | A'lo (5)              | Yaxshi (4)          | Qoniqarli (3)       | Qoniqarsiz (2)\nMazmun       | To'liq va chuqur      | Asosan to'liq       | Qisman              | Yuzaki\nTuzilma      | Mantiqiy, aniq        | Asosan mantiqiy     | Ba'zi uzilishlar    | Tartibsiz\nDalillar     | Ko'p va ishonchli     | Yetarli             | Kam                 | Yo'q\nTil va uslub | Akademik, xatosiz     | Kichik xatolar      | Sezilarli xatolar   | Ko'p xatolar\nManbalar     | To'g'ri iqtibos       | Kichik kamchilik    | Noto'liq            | Iqtibossiz`;
  return `TEST: "${topic}" (namunaviy — shablon asosida)\n\n` + out.join('\n\n') + key;
}

    body = `<div class="row between wrap" style="margin-bottom:14px"><div><h2>Baholash jurnali ${demoTag('Namuna guruh')}</h2><p class="small muted">Ballarni o'zgartiring — umumiy ball va baho avtomatik hisoblanadi. Joriy 30 + Oraliq 30 + Yakuniy 40 = 100. Davomat 75% dan past bo'lsa — yakuniyga ruxsat yo'q.</p></div><button class="btn primary" data-act="addStudent">${ic('plus', 15)} Talaba qo'shish</button></div>

  if (tab === 'assess') { const a = S.assess || {}; body = `<div class="grid g3"><div class="card"><h2 style="margin-bottom:12px">Test generatori</h2>
    <div class="stack"><div class="field"><label for="as-topic">Mavzu</label><input class="input" id="as-topic" value="${esc(a.topic || '')}" placeholder="Masalan: Turizm bozori"></div>
    <div class="field"><label for="as-type">Savol turi</label><select class="select" id="as-type">${[['mcq','Ko\'p tanlovli (MCQ)'],['open','Ochiq savollar'],['tf','Rost / Yolg\'on'],['rubric','Baholash rubrikasi']].map(([k, l]) => `<option value="${k}" ${a.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label for="as-n">Savollar soni</label><input class="input" type="number" id="as-n" min="1" max="20" value="${a.n || 5}"></div>

    <p class="xs muted">${ic('info', 12)} Demo: savollar real AI emas, balki IUB shablonlari asosida yaratiladi. Mazmunini o'zingiz to'ldiring va tekshiring. To'liq AI yordami uchun <a href="#prompts" data-act="nav" data-v="prompts">Prompt kutubxonasi</a>dan foydalaning.</p></div></div>
    <div class="card span2"><div class="card-head"><h3>Natija ${demoTag('Namunaviy chiqish')}</h3>${UI.assessOut ? `<button class="btn sm" data-act="copy" data-from="#assessOut">${ic('copy', 14)} Nusxalash</button>` : ''}</div>${UI.assessOut ? `<pre class="prompt-box" id="assessOut" style="max-height:520px;margin:0;font-family:inherit">${esc(UI.assessOut)}</pre>` : emptyState('Hali hech narsa yaratilmadi', 'Mavzu va savol turini tanlab, "Yaratish" tugmasini bosing.', 'list')}</div></div>`; }
  if (tab === 'present') body = `<div class="row between wrap" style="margin-bottom:14px"><div><h2>Taqdimot rejalashtiruvchisi</h2><p class="small muted">Slaydlar tuzilmasini rejalang, tartibini o'zgartiring va Gamma yoki Canva'ga o'tkazing.</p></div><div class="row"><button class="btn" data-act="copy" data-text="${esc(S.slides.map((s, i) => `${i + 1}. ${s.t}${s.n ? ' — ' + s.n : ''}`).join('\n'))}">${ic('copy', 15)} Tuzilmani nusxalash</button><button class="btn primary" data-act="slideAdd">${ic('plus', 15)} Slayd</button></div></div>
    <div class="grid g3"><div class="span2 stack">${S.slides.map((s, i) => `<div class="card row" style="padding:12px;align-items:flex-start"><div class="ico-box beige" style="font-weight:700">${i + 1}</div><div style="flex:1" class="stack" ><input class="input" id="sl-t-${s.id}" value="${esc(s.t)}" data-live="slideEdit" data-id="${s.id}" data-k="t" aria-label="Sarlavha" style="font-weight:600"><input class="input" id="sl-n-${s.id}" value="${esc(s.n)}" data-live="slideEdit" data-id="${s.id}" data-k="n" placeholder="Ma'ruzachi izohi / tezislar" aria-label="Izoh"></div><div class="stack" style="gap:2px"><button class="fav" data-act="slideMove" data-id="${s.id}" data-d="-1" aria-label="Yuqoriga">↑</button><button class="fav" data-act="slideMove" data-id="${s.id}" data-d="1" aria-label="Pastga">↓</button><button class="fav" data-act="slideDel" data-id="${s.id}" aria-label="${T('del')}">${ic('trash', 14)}</button></div></div>`).join('') || emptyState('Slaydlar yo\'q', '', 'presentation')}</div>
    <div class="stack"><div class="card beige"><h3 style="margin-bottom:8px">10-20-30 qoidasi</h3><p class="small muted">10 slayd, 20 daqiqa, kamida 30 pt shrift — talabalar diqqatini ushlab turish uchun.</p></div><div class="card"><h3 style="margin-bottom:10px">Vositalar</h3><div class="stack">${extLink('https://gamma.app', 'Gamma')}${extLink('https://www.canva.com', 'Canva')}${extLink('https://slides.google.com', 'Google Slides')}</div></div></div></div>`;
  if (tab === 'syllabus') { const s = S.syl; const f = (k, l, ta) => `<div class="field ${ta ? 'full' : ''}"><label for="sy-${k}">${l}</label>${ta ? `<textarea class="textarea" id="sy-${k}" data-live="sylEdit" data-k="${k}">${esc(s[k])}</textarea>` : `<input class="input" id="sy-${k}" data-live="sylEdit" data-k="${k}" value="${esc(s[k])}">`}</div>`;
    body = `<div class="grid g2"><div class="card"><h2 style="margin-bottom:12px">Sillabus quruvchi</h2><div class="form-grid">${f('name','Fan nomi',1)}${f('cr','Kredit')}${f('hrs','Soatlar')}${f('desc','Fan tavsifi',1)}${f('weeks','Haftalik mavzular (har qatorda bitta)',1)}${f('lit','Asosiy adabiyotlar',1)}</div></div>
    <div class="card"><div class="card-head"><h3>Jonli ko'rinish</h3><button class="btn sm" data-act="copy" data-from="#sylPrev">${ic('copy', 14)} Nusxalash</button></div><pre class="prompt-box" id="sylPrev" style="max-height:600px;margin:0;font-family:inherit">${esc(sylText())}</pre></div></div>`; }
  if (tab === 'activities') { const c = UI.f.actcat || 'all'; const cats = [...new Set(ACTIVITIES.map(a => a.cat))];
    body = `<div class="chips" style="margin-bottom:14px"><button class="chip ${c === 'all' ? 'active' : ''}" data-act="chip" data-k="actcat" data-v="all">${T('all')}</button>${cats.map(x => `<button class="chip ${c === x ? 'active' : ''}" data-act="chip" data-k="actcat" data-v="${x}">${x}</button>`).join('')}</div>
    <div class="grid g-auto">${ACTIVITIES.filter(a => c === 'all' || a.cat === c).map(a => `<div class="card stack" style="gap:8px"><div class="row between"><span class="pill lav">${a.cat}</span><span class="xs muted">${ic('clock', 12)} ${a.t}</span></div><h3>${a.n}</h3><p class="small muted">${a.d}</p></div>`).join('')}</div>`; }
  if (tab === 'tracker') body = `<div class="grid g4" style="margin-bottom:16px">${[['Dars rejalari',S.lessons.length,'teacher'],['Baholangan talabalar',S.students.filter(s => s.fin > 0).length + '/' + S.students.length,'check'],['Bu hafta dars soatlari','12','clock'],['Tayyorlangan testlar',UI.assessOut ? 1 : 0,'list']].map(x => `<div class="card row"><div class="ico-box">${ic(x[2], 17)}</div><div class="stat"><span class="v" style="font-size:22px">${x[1]}</span><span class="l">${x[0]}</span></div></div>`).join('')}</div>
    <div class="grid g2"><div class="card"><div class="card-head"><h3>Haftalik yuklama (soat)</h3>${demoTag('Namuna')}</div>${barChart([{l:'Dars',v:12,hi:1},{l:'Tayyorgarlik',v:8},{l:'Baholash',v:5},{l:'Tadqiqot',v:6},{l:'Ma\'muriy',v:4}], { h: 180 })}</div>
    <div class="card"><h3 style="margin-bottom:12px">Semestr maqsadlari</h3>${[['Barcha ma\'ruzalar slaydlarini yangilash',70],['2 ta maqola yuborish',50],['AI kursini tugatish',30],['Har bir talabaga fikr-mulohaza',85]].map(g => `<div style="margin-bottom:12px"><div class="row between small" style="margin-bottom:5px"><span>${g[0]}</span><b>${g[1]}%</b></div>${progress(g[1])}</div>`).join('')}<p class="xs muted">Namunaviy maqsadlar</p></div></div>`;
  return `${pageHead('teacher')}${tabs('teacher', [['plan','Dars rejasi','bookOpen'],['grades','Baholash jurnali','chart'],['assess','Test generatori','list'],['present','Taqdimot','presentation'],['syllabus','Sillabus','file'],['activities','Mashg\'ulotlar','users'],['tracker','Samaradorlik','trend']], tab)}${body}`;
};

/* ============ Student Hub ============ */
const DAYS = ['Du','Se','Ch','Pa','Ju','Sh','Ya'], DAYN = { Du:'Dushanba', Se:'Seshanba', Ch:'Chorshanba', Pa:'Payshanba', Ju:'Juma', Sh:'Shanba', Ya:'Yakshanba' };
ACT.planAdd = el => { const d = el.dataset.d, inp = $('#pa-' + d), v = inp.value.trim(); if (!v) { inp.focus(); return; } S.studyPlan[d].push(v); save(); rerender(); };
ACT.planDel = el => { S.studyPlan[el.dataset.d].splice(+el.dataset.i, 1); save(); rerender(); };
const AST = { todo:['Boshlanmagan',''], progress:['Jarayonda','amber'], done:['Topshirildi','green'] };
ACT.asCycle = el => { const a = S.assignments.find(x => x.id === el.dataset.id); a.st = { todo:'progress', progress:'done', done:'todo' }[a.st]; save(); rerender(); };
ACT.asDel = el => { S.assignments = S.assignments.filter(x => x.id !== el.dataset.id); save(); rerender(); };
ACT.asAdd = () => openModal(`${modalHead('Yangi topshiriq')}<form data-form="assign"><div class="form-grid"><div class="field full"><label for="a-t">Topshiriq</label><input class="input" id="a-t" name="t" required></div><div class="field"><label for="a-s">Fan</label><input class="input" id="a-s" name="subj"></div><div class="field"><label for="a-d">Muddat</label><input class="input" type="date" id="a-d" name="due" value="${addDays(7)}"></div></div><div class="modal-foot"><button type="button" class="btn" data-act="closeModal">${T('cancel')}</button><button class="btn primary">${T('add')}</button></div></form>`);
FORMS.assign = f => { const d = formData(f); if (!d.t.trim()) return; S.assignments.push({ id: uid(), t: d.t, subj: d.subj || '—', due: d.due || addDays(7), st: 'todo' }); save(); closeModal(); rerender(); toast('Topshiriq qo\'shildi'); };
ACT.cvEdit = el => { S.cv[el.dataset.k] = el.value; save(); const p = $('#cvPrev'); if (p) p.innerHTML = cvHTML(); };
const cvHTML = () => { const c = S.cv; return `<div style="font-family:var(--serif);font-size:24px;font-weight:600">${esc(c.name || 'Ismingiz Familiyangiz')}</div><div class="muted" style="margin-bottom:12px">${esc(c.title || 'Iqtisodiyot fakulteti talabasi')} · ${esc(c.email || 'email@example.com')}</div>${[['Ta\'lim',c.edu || 'Universitet nomi, yo\'nalish, yillar'],['Tajriba',c.exp || 'Amaliyot, ko\'ngillilik, loyihalar'],['Ko\'nikmalar',c.skills || 'Excel, ingliz tili (B2), taqdimot']].map(([h, t]) => `<div style="margin-bottom:12px"><div class="xs" style="text-transform:uppercase;letter-spacing:.08em;color:var(--lav-600);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:5px">${h}</div><div class="small" style="white-space:pre-wrap">${esc(t)}</div></div>`).join('')}`; };
const cvText = () => { const c = S.cv; return `${c.name}\n${c.title} · ${c.email}\n\nTA'LIM\n${c.edu}\n\nTAJRIBA\n${c.exp}\n\nKO'NIKMALAR\n${c.skills}`; };
ACT.examTopic = el => { UI.exam = UI.exam || {}; UI.exam[el.dataset.i] = !UI.exam[el.dataset.i]; S.exam = UI.exam; save(); rerender(); };
ACT.careerTog = el => { S.career = S.career || {}; S.career[el.dataset.i] = !S.career[el.dataset.i]; save(); rerender(); };
const resList = arr => `<div class="grid g-auto">${arr.map(([n, d, u]) => `<div class="card stack" style="gap:8px"><h3>${n}</h3><p class="small muted" style="flex:1">${d}</p>${extLink(u, 'Ochish')}</div>`).join('')}</div>`;

  <div class="card"><div class="card-head"><h3>O'qish soatlari</h3>${demoTag('Namuna')}</div>${barChart([{l:'Du',v:3},{l:'Se',v:1},{l:'Ch',v:3},{l:'Pa',v:1.5},{l:'Ju',v:2},{l:'Sh',v:3,hi:1},{l:'Ya',v:0}], { h: 160 })}</div></div>
  <h2 style="margin:24px 0 12px">Modullar</h2>
  <div class="grid g-auto">${[['plan','O\'qish rejasi','calendar'],['assign','Topshiriqlar trekeri','check'],['exam','Imtihonga tayyorgarlik','target'],['present','Taqdimot resurslari','presentation'],['cv','CV quruvchi','cv'],['letter','Motivatsion xat','pen'],['scholar','Stipendiya qidirish','radar'],['english','Ingliz tili resurslari','lang'],['skills','Tadqiqot ko\'nikmalari','flask'],['career','Amaliyot va karyera','briefcase']].map(m => `<button class="quick hover-card" style="flex-direction:row;align-items:center" data-act="tab" data-k="student" data-v="${m[0]}"><div class="ico-box">${ic(m[2], 17)}</div><b style="flex:1">${m[1]}</b>${ic('chevR', 15)}</button>`).join('')}</div>`;
  if (tab === 'plan') body = `<div class="row between" style="margin-bottom:14px"><div><h2>Haftalik o'qish rejasi</h2><p class="small muted">Har bir kunga mashg'ulot qo'shing. Jami: ${planTotal}</p></div></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">${DAYS.map(d => `<div class="card" style="padding:14px"><h3 style="margin-bottom:8px">${DAYN[d]}</h3><div class="stack" style="gap:6px;min-height:40px">${S.studyPlan[d].map((x, i) => `<div class="row between" style="background:var(--lav-50);border-radius:8px;padding:6px 8px"><span class="small">${esc(x)}</span><button class="fav" data-act="planDel" data-d="${d}" data-i="${i}" aria-label="${T('del')}">${ic('x', 13)}</button></div>`).join('') || '<span class="xs muted">Bo\'sh kun</span>'}</div><div class="row" style="margin-top:10px;gap:6px"><input class="input" id="pa-${d}" placeholder="Fan — soat" style="padding:6px 8px;font-size:12.5px" aria-label="Mashg'ulot"><button class="btn sm" data-act="planAdd" data-d="${d}" aria-label="${T('add')}">${ic('plus', 13)}</button></div></div>`).join('')}</div>`;
  if (tab === 'assign') body = `<div class="row between wrap" style="margin-bottom:14px"><div><h2>Topshiriqlar trekeri</h2><p class="small muted">Holatni o'zgartirish uchun belgini bosing.</p></div><button class="btn primary" data-act="asAdd">${ic('plus', 15)} Topshiriq</button></div>

/* tiny markdown renderer with source refs [§N] */
function md(t) {
  const lines = esc(t || '').split('\n'); let out = '', inList = '', inTable = false;
  const inline = x => x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\[§\s?(\d+)\]/g, '<button class="src" data-act="secOpen" data-n="$1">§$1</button>');
  const close = () => { if (inList) { out += `</${inList}>`; inList = ''; } if (inTable) { out += '</tbody></table></div>'; inTable = false; } };
  for (const raw of lines) {
    const l = raw.trim();
    if (/^\|.*\|$/.test(l)) { if (/^\|[\s:\-|]+\|$/.test(l)) continue; const cells = l.slice(1, -1).split('|').map(c => inline(c.trim())); if (!inTable) { close(); out += `<div class="tbl-wrap" style="margin:8px 0"><table class="tbl"><thead><tr>${cells.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>`; inTable = true; } else out += `<tr>${cells.map(c => `<td>${c}</td>`).join('')}</tr>`; continue; }
    if (inTable) { out += '</tbody></table></div>'; inTable = false; }
    let m;
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { close(); out += `<h4>${inline(m[1])}</h4>`; continue; }
    if ((m = l.match(/^[-*•]\s+(.*)/))) { if (inList !== 'ul') { close(); out += '<ul style="margin:4px 0;padding-left:20px">'; inList = 'ul'; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^\d+[.)]\s+(.*)/))) { if (inList !== 'ol') { close(); out += '<ol style="margin:4px 0;padding-left:20px">'; inList = 'ol'; } out += `<li>${inline(m[1])}</li>`; continue; }
    close(); out += l ? `<p style="margin:6px 0">${inline(l)}</p>` : '';
  }
  close(); return out;
}

/* ============ text extraction (all in the browser) ============ */
const MAX_CHARS = 170000;
function chunkText(text, size = 1800) {
  const paras = text.replace(/\r/g, '').split(/\n{2,}|\n(?=\s*[-•\d])/).map(p => p.trim()).filter(Boolean); const out = []; let cur = '';
  for (const p of paras) { if ((cur + '\n' + p).length > size && cur) { out.push(cur); cur = p; } else cur = cur ? cur + '\n' + p : p; }
  if (cur) out.push(cur); return out;
}
async function extractFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (['txt','md','csv','json'].includes(ext)) return { kind: 'text', sections: chunkText(await file.text()).map((t, i) => ({ label: '§' + (i + 1), text: t })) };
  if (ext === 'pdf') {
    const pdfjs = await import(new URL('pdf.min.mjs', location.href).href);
    pdfjs.GlobalWorkerOptions.workerSrc = new URL('pdf.worker.min.mjs', location.href).href;
    const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; const secs = [];
    for (let i = 1; i <= doc.numPages; i++) { const pg = await doc.getPage(i); const tc = await pg.getTextContent(); let t = ''; for (const it of tc.items) { t += it.str + (it.hasEOL ? '\n' : ' '); } t = t.replace(/[ \t]+/g, ' ').trim(); if (t) secs.push({ label: i + '-bet', page: i, text: t }); }
    return { kind: 'pdf', pages: doc.numPages, sections: secs };
  }
  if (ext === 'docx' || ext === 'pptx') {
    if (typeof JSZip === 'undefined') throw { message: 'JSZip júklenbedi' };
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    if (ext === 'docx') { const xml = await zip.file('word/document.xml').async('string'); const paras = xml.split(/<\/w:p>/).map(p => (p.match(/<w:t[^>]*>([^<]*)<\/w:t>/g) || []).map(x => x.replace(/<[^>]+>/g, '')).join('')).map(decodeXml).filter(x => x.trim()); return { kind: 'docx', sections: chunkText(paras.join('\n\n')).map((t, i) => ({ label: '§' + (i + 1), text: t })) }; }
    const slides = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => +a.match(/(\d+)\.xml/)[1] - +b.match(/(\d+)\.xml/)[1]); const secs = [];
    for (let i = 0; i < slides.length; i++) { const xml = await zip.file(slides[i]).async('string'); const t = (xml.split(/<\/a:p>/).map(p => (p.match(/<a:t>([^<]*)<\/a:t>/g) || []).map(x => x.replace(/<[^>]+>/g, '')).join('')).map(decodeXml).filter(x => x.trim())).join('\n'); if (t.trim()) secs.push({ label: (i + 1) + '-slayd', page: i + 1, text: t }); }
    return { kind: 'pptx', pages: slides.length, sections: secs };
  }
  if (['png','jpg','jpeg','webp','gif'].includes(ext)) {
    if (!CLOUD.sample) throw { message: 'Súwretten tekst alıw ushın AI kerek — AI usı kóriniste qosılmaǵan.' };
    const text = await CLOUD.sample('Bul súwrettegi barlıq tekstti dál kóshirip jaz (OCR). Formulalardı hám kestelerdi de saqla. Tek tekstti qaytar.', { images: [file], modelTier: 'default' }).then(r => r.text);
    return { kind: 'image', sections: chunkText(text).map((t, i) => ({ label: '§' + (i + 1), text: t })) };
  }
  throw { message: `"${ext}" formatı qollap-quwatlanbaydı. PDF, DOCX, PPTX, TXT yamasa súwret júkleń.` };
}
const decodeXml = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

async function runDocAction(key) {
  const m = S.docs.find(x => x.id === UI.detail.doc), r = await lecLoad(m.id), a = DOC_ACTIONS.find(x => x[0] === key);
  const lang = key === 'translate' ? ($('#trLang') ? $('#trLang').value : 'inglis tiline') : null;
  const ctx = docContext(r, 60000);
  const instr = key === 'translate' ? `Hújjettiń tiykarǵı mazmunın ${lang} awdar. Terminlerdi durıs saqla. Úlken hújjet bolsa, eń áhmiyetli bólimlerin awdar hám buni eskert.` : a[3];
  const prompt = `Sen tájiriybeli universitet oqıtıwshısı hám metodistsań. Tómendegi hújjet ("${m.name}"${m.subj ? ', pán: ' + m.subj : ''}) boyınsha wazıypanı orınla.\n\nWAZIYPA: ${instr}\n\nQÁDELER:\n- Juwaptı ${key === 'translate' ? 'talap etilgen tilde' : AI_LANG()} ber.\n- Tek hújjetke súyen. Hújjette joq qosımsha maǵlıwmat qossań, onı "Qosımsha (hújjette joq):" dep anıq belgile.\n- Áhmiyetli pikirlerdiń janına derek bólimin [§N] formatında kórset (N — bólim nomeri).\n- Citata, bet nomeri yamasa faktlerdi oylap tappa.\n- Markdown qollan (## sarlawhalar, - dizimler, **qalıń**, | kesteler |).\n\nHÚJJET:\n${ctx}`;
  UI.aiBusy = key; UI.aiStream = ''; rerender();
  try {
    const text = await aiText(prompt, t => { UI.aiStream = t; const el = $('#aiStream'); if (el) el.innerHTML = md(t); });
    r.out[key === 'translate' ? 'translate' : key] = { text, at: new Date().toISOString(), lang };
    await lecSave(m.id, r); UI.docOut = key === 'translate' ? 'translate' : key;
  } catch (e) { toast(aiErr(e), 'alert'); }
  UI.aiBusy = null; rerender();
}
function docContext(r, max) { let s = '', i = 0; for (const sec of r.sections) { i++; const chunk = `[§${i} · ${sec.label}]\n${sec.text}\n\n`; if (s.length + chunk.length > max) { s += `[... hújjettiń qalǵan ${r.sections.length - i + 1} bólimi kontekstke sıymadı]`; break; } s += chunk; } return s; }
function relevantContext(r, q, max = 24000) {
  const words = q.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 3);
  const scored = r.sections.map((s, i) => { const t = s.text.toLowerCase(); let sc = 0; for (const w of words) { const stem = w.slice(0, Math.max(4, w.length - 2)); if (t.includes(stem)) sc += 1 + (t.split(stem).length - 2) * .2; } return { i, sc }; }).sort((a, b) => b.sc - a.sc);
  const pick = new Set(); let len = 0; for (const x of scored) { const l = r.sections[x.i].text.length; if (len + l > max) continue; pick.add(x.i); len += l; if (len > max * .9) break; }
  return [...pick].sort((a, b) => a - b).map(i => `[§${i + 1} · ${r.sections[i].label}]\n${r.sections[i].text}`).join('\n\n');
}
ACT.docAct = el => runDocAction(el.dataset.k);
ACT.docOut = el => { UI.docOut = el.dataset.k; rerender(); };

const wrapTxt = (t, n = 18) => { const w = String(t || '').split(/\s+/); const lines = []; let cur = ''; for (const x of w) { if ((cur + ' ' + x).trim().length > n && cur) { lines.push(cur); cur = x; } else cur = (cur + ' ' + x).trim(); } if (cur) lines.push(cur); return lines.slice(0, 3); };
const svgText = (x, y, t, n, cls = '', size = 12, weight = 500) => { const ls = wrapTxt(t, n); return `<text x="${x}" y="${y - (ls.length - 1) * size * .6}" text-anchor="middle" font-size="${size}" font-weight="${weight}" style="fill:var(--ink)" ${cls}>${ls.map((l, i) => `<tspan x="${x}" dy="${i ? size * 1.2 : 0}">${esc(l)}</tspan>`).join('')}</text>`; };
const PAL = ['var(--a1)','var(--a2)','var(--a3)','#E7B05A','#3CC7A5','#7FA7FF','#F07A78'];
function mindmapSVG(j) {
  const W = 960, H = 620, cx = W / 2, cy = H / 2, br = j.branches || []; let s = '';
  br.forEach((b, i) => {
    const a = (i / br.length) * Math.PI * 2 - Math.PI / 2, bx = cx + Math.cos(a) * 200, by = cy + Math.sin(a) * 165, col = PAL[i % PAL.length];
    s += `<path d="M${cx},${cy} Q${cx + Math.cos(a) * 90},${cy + Math.sin(a) * 60} ${bx},${by}" stroke="${col}" stroke-width="3" fill="none" opacity=".8"/>`;
    const ch = b.children || [];
    ch.forEach((c, k) => { const spread = .62, ca = a + (ch.length > 1 ? (k / (ch.length - 1) - .5) * spread * Math.min(1.6, ch.length / 2) : 0), x = cx + Math.cos(ca) * 360, y = cy + Math.sin(ca) * 255;
      s += `<line x1="${bx}" y1="${by}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="1.5" opacity=".55"/><rect x="${x - 70}" y="${y - 20}" width="140" height="40" rx="10" style="fill:var(--surface)" stroke="${col}" stroke-opacity=".6"/>${svgText(x, y + 4, c, 20, '', 11, 500)}`; });
    s += `<rect x="${bx - 78}" y="${by - 24}" width="156" height="48" rx="14" fill="${col}" opacity=".2"/><rect x="${bx - 78}" y="${by - 24}" width="156" height="48" rx="14" fill="none" stroke="${col}"/>${svgText(bx, by + 4, b.label, 20, '', 12.5, 650)}`;
  });
  s += `<circle cx="${cx}" cy="${cy}" r="70" fill="url(#mmg)"/>${svgText(cx, cy + 5, j.center, 14, '', 14, 700).replace('style="fill:var(--ink)"', 'style="fill:#fff"')}`;
  return `<svg class="mm" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Aqıl kartası"><defs><radialGradient id="mmg"><stop offset="0" stop-color="#A898FF"/><stop offset="1" stop-color="#6A5AE0"/></radialGradient></defs>${s}</svg>`;
}
function conceptSVG(j) {
  const W = 960, H = 600, cx = W / 2, cy = H / 2, ns = j.nodes || [], pos = {};
  ns.forEach((n, i) => { const a = (i / ns.length) * Math.PI * 2 - Math.PI / 2; pos[n.id] = [cx + Math.cos(a) * 360, cy + Math.sin(a) * 230]; });
  let e = '', nd = '';
  (j.edges || []).forEach(ed => { const p = pos[ed.from], q = pos[ed.to]; if (!p || !q) return; const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2; e += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="var(--lav)" stroke-opacity=".5" stroke-width="1.6" marker-end="url(#arr)"/><rect x="${mx - 52}" y="${my - 10}" width="104" height="20" rx="6" style="fill:var(--bg)" opacity=".9"/><text x="${mx}" y="${my + 4}" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">${esc(String(ed.label || '').slice(0, 24))}</text>`; });
  ns.forEach((n, i) => { const [x, y] = pos[n.id]; nd += `<rect x="${x - 72}" y="${y - 24}" width="144" height="48" rx="24" style="fill:var(--surface)" stroke="${PAL[i % PAL.length]}" stroke-width="2"/>${svgText(x, y + 4, n.label, 18, '', 12, 600)}`; });

    const cards = (Array.isArray(j) ? j : j.cards || []).map(c => ({ id: uid(), f: c.f, b: c.b, src: c.src, box: 0, due: todayISO(), fav: false, seen: 0 }));

/* ============ Self Discipline — jeke rawajlanıw sisteması ============ */
const GOAL_CATS = { edu:'Bilim', career:'Karyera', health:'Densawlıq hám sport', read:'Oqıw (kitap)', fin:'Finanslıq rawajlanıw', lang:'Til úyreniw', growth:'Jeke rawajlanıw', family:'Shańaraq hám turmıs', prof:'Kásiplik rawajlanıw' };
const PERIODS = { day:'Kúnlik', week:'Háptelik', month:'Aylıq', year:'Jıllıq' };
const HCATS = { study:'Oqıw', health:'Densawlıq', read:'Kitap', money:'Pul', focus:'Fokus', life:'Turmıs' };
const WD = ['Du','Se','Sá','Pi','Ju','Sh','Ye'];
const isoDow = iso => (new Date(iso + 'T00:00:00').getDay() + 6) % 7;
const lastNDays = n => Array.from({ length: n }, (_, i) => addDays(i - n + 1));
const scheduled = (h, iso) => (h.days || [0,1,2,3,4,5,6]).includes(isoDow(iso)) && iso >= (h.created || '2000-01-01');
function streak(h) { let s = 0; for (let i = 0; i < 400; i++) { const iso = addDays(-i); if (iso < (h.created || '2000')) break; if (!scheduled(h, iso)) continue; if (h.log[iso]) s++; else if (i === 0) continue; else break; } return s; }
function habitRate(h, n = 30) { const ds = lastNDays(n).filter(d => scheduled(h, d) && d < todayISO() || (d === todayISO() && h.log[d])); return ds.length ? Math.round(ds.filter(d => h.log[d]).length / ds.length * 100) : null; }
function dayHabitRate(iso) { const hs = S.dhabits.filter(h => scheduled(h, iso)); return hs.length ? hs.filter(h => h.log[iso]).length / hs.length : null; }
function disciplineScore() {
  const days = lastNDays(7); const hr = days.map(dayHabitRate).filter(x => x !== null);
  const due = S.tasks.filter(t => t.due >= days[0] && t.due <= todayISO()); const tr = due.length ? due.filter(t => t.done).length / due.length : null;
  const fm = days.reduce((a, d) => a + (S.focusLog[d] || 0), 0); const fr = Math.min(1, fm / (7 * 60));
  const parts = []; if (hr.length) parts.push([hr.reduce((a, b) => a + b, 0) / hr.length, .5]); if (tr !== null) parts.push([tr, .3]); if (fm) parts.push([fr, .2]);
  if (!parts.length) return null; const w = parts.reduce((a, p) => a + p[1], 0); return Math.round(parts.reduce((a, p) => a + p[0] * p[1], 0) / w * 100);
}

function periodReport(days) {
  const cur = lastNDays(days), prev = Array.from({ length: days }, (_, i) => addDays(i - 2 * days + 1));
  const fm = ds => ds.reduce((a, d) => a + (S.focusLog[d] || 0), 0);
  const td = ds => S.tasks.filter(t => t.done && t.doneAt && ds.includes(t.doneAt.slice(0, 10))).length;
  const hr = ds => { const v = ds.map(dayHabitRate).filter(x => x !== null); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 100) : null; };
  const habits = S.dhabits.map(h => ({ n: h.n, r: (() => { const ds = cur.filter(d => scheduled(h, d)); return ds.length ? Math.round(ds.filter(d => h.log[d]).length / ds.length * 100) : null; })() })).filter(x => x.r !== null).sort((a, b) => b.r - a.r);
  const neglected = S.goals.filter(g => g.status === 'active' && (!g.upd || g.upd < cur[0]));
  const distract = S.journal.filter(e => cur.includes(e.date) && e.ans[1]).map(e => e.ans[1]);
  return { focus: fm(cur), focusPrev: fm(prev), tasks: td(cur), tasksPrev: td(prev), hr: hr(cur), hrPrev: hr(prev), habits, neglected, distract, journalN: S.journal.filter(e => cur.includes(e.date)).length };
}
