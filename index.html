ACT.calc = () => { UI.calcTick = (UI.calcTick || 0) + 1; const el = $('#calcOut'); if (el) el.innerHTML = calcResults(); };
const cv = id => { const e = $('#' + id); return e ? +e.value || 0 : 0; };
function calcResults() {
  const out = [];
  const T1 = cv('c1t'), D1 = cv('c1d'); if (T1 && D1) out.push(['Maqsetke jetiw ushın', `Kúnine <b>${money(T1 / D1)}</b> · háptesine <b>${money(T1 / D1 * 7)}</b> · ayına <b>${money(T1 / D1 * 30.4)}</b>`]);
  const T2 = cv('c2t'), A2 = cv('c2a'), F2 = $('#c2f') ? $('#c2f').value : 'm'; if (T2 && A2) { const per = { d: 1, w: 7, m: 30.4 }[F2], days = Math.ceil(T2 / A2) * per; out.push(['Maqsetke shekem', `<b>${Math.ceil(T2 / A2)}</b> ${{ d: 'kún', w: 'hápte', m: 'ay' }[F2]} (≈ ${fmtDate(addDays(Math.round(days)))})`]); }
  const M3 = cv('c3m'); if (M3) out.push(['Ayına jıynasańız', `3 ayda <b>${money(M3 * 3)}</b> · 6 ayda <b>${money(M3 * 6)}</b> · 12 ayda <b>${money(M3 * 12)}</b>`]);
  const P5 = cv('c5p'), N5 = cv('c5n'); if (P5 && N5) out.push(['Shıǵıstı azaytsańız', `Háptesine ${N5} ret × ${money(P5)} → ayına <b>${money(P5 * N5 * 4.33)}</b>, jılına <b>${money(P5 * N5 * 52)}</b> úneminiz`]);
  return out.length ? out.map(([a, b]) => `<div class="list-row" style="align-items:flex-start"><span class="pill lav">${a}</span><span class="small">${b}</span></div>`).join('') : '<p class="small muted">Mánislerdi kiritiń — nátiyje bul jerde payda boladı.</p>';
}
function compound(P, PMT, r, y) { const rows = []; let bal = P, contrib = P; for (let m = 1; m <= y * 12; m++) { bal = bal * (1 + r / 100 / 12) + PMT; contrib += PMT; if (m % 12 === 0) rows.push({ y: m / 12, bal, contrib }); } return rows; }
ACT.calcF = () => { const el = $('#futOut'); if (el) el.innerHTML = futureOut(); };
function futureOut() {
  const P = cv('fP'), PMT = cv('fM'), r = cv('fR'), y = Math.min(40, Math.max(1, cv('fY') || 5)), inf = cv('fI');
  const rows = compound(P, PMT, r, y); const last = rows[rows.length - 1] || { bal: P, contrib: P }; const real = inf ? last.bal / Math.pow(1 + inf / 100, y) : null;
  return `<div class="grid g3" style="margin:12px 0"><div class="card stat"><span class="l">${y} jıldan keyin (boljaw)</span><span class="v" style="font-size:20px">${money(last.bal)}</span></div><div class="card stat"><span class="l">Ózińiz salǵan summa</span><span class="v" style="font-size:20px">${money(last.contrib)}</span></div><div class="card stat"><span class="l">${inf ? 'Inflyaciyanı esapqa alǵandaǵı satıp alıw kúshi' : 'Procent tabısı (boljaw)'}</span><span class="v" style="font-size:20px">${inf ? money(real) : money(last.bal - last.contrib)}</span></div></div>
  ${rows.length > 1 ? lineChart([{ n: 'Balans (boljaw)', c: 'var(--a1)', d: rows.map(x => Math.round(x.bal)), fill: 1 }, { n: 'Salınǵan summa', c: 'var(--a2)', d: rows.map(x => Math.round(x.contrib)) }], rows.map(x => x.y + '-j'), { h: 170 }) : ''}
  <p class="xs muted" style="margin-top:8px">${ic('alert', 12)} Bul — siz kiritken farazlarǵa tiykarlanǵan oqıw ushın boljaw. Haqıyqıy tabıs kepillenbeydi; stavka, inflyaciya hám salıqlar ózgeriwi múmkin.</p>`;
}

/* ---------- Community (shared, moderated) ---------- */
const NAMES = {};
async function resolveNames(ids) { if (!CLOUD.user || !CLOUD.user.profiles) return; const need = ids.filter(id => !(id in NAMES)); if (!need.length) return; try { const ps = await CLOUD.user.profiles(need); need.forEach(id => NAMES[id] = (ps[id] && ps[id].name) || ''); rerender(); } catch (e) {} }
const nameOf = id => id === CLOUD.uid ? (S.name || 'Siz') : (NAMES[id] || 'Paydalanıwshı');
function allPosts() { const out = []; SHARED.posts.forEach(d => (d.items || []).forEach(p => { if (!p.hidden || CLOUD.owner) out.push({ ...p, uid: d.uid, key: d.uid + ':' + p.id }); })); return out.sort((a, b) => (b.at || '').localeCompare(a.at || '')); }
const repliesOf = key => { const r = []; SHARED.posts.forEach(d => (d.replies || []).forEach(x => { if (x.post === key && (!x.hidden || CLOUD.owner)) r.push({ ...x, uid: d.uid }); })); return r.sort((a, b) => a.at.localeCompare(b.at)); };
const votesOf = key => SHARED.posts.reduce((a, d) => a + ((d.votes || {})[key] ? 1 : 0), 0);
async function myPostDoc() { const me = SHARED.posts.find(d => d.uid === CLOUD.uid); return me ? JSON.parse(JSON.stringify(me)) : { uid: CLOUD.uid, items: [], replies: [], votes: {} }; }
async function writeMyPosts(doc) { const { uid: _, ...body } = doc; await CLOUD.db.doc('posts/' + CLOUD.uid).set(body); const i = SHARED.posts.findIndex(d => d.uid === CLOUD.uid); if (i >= 0) SHARED.posts[i] = doc; else SHARED.posts.push(doc); }
ACT.newPost = () => { if (!CLOUD.uid) { toast('Jámiyetke jazıw ushın sayt Claude ishinde ashılıwı kerek', 'alert'); return; } openModal(`${modalHead('Jańa soraw yamasa pikir', 'Postıńız platformaǵa kiretuǵın basqa paydalanıwshılarǵa kórinedi. Jeke maǵlıwmat jazbań.')}<form data-form="post"><div class="stack"><div class="field"><label for="np-t">Sarlawha</label><input class="input" id="np-t" name="t" required maxlength="140"></div><div class="field"><label for="np-ch">Bólim</label><select class="select" id="np-ch" name="ch"><option value="teacher">Oqıtıwshılar</option><option value="research">Izertlewshiler</option><option value="student">Studentler</option><option value="general">Ulıwma</option></select></div><div class="field"><label for="np-b">Mazmunı</label><textarea class="textarea" id="np-b" name="b" required maxlength="3000"></textarea></div></div><div class="modal-foot"><button type="button" class="btn" data-act="closeModal">${T('cancel')}</button><button class="btn primary">Járiyalaw</button></div></form>`); };
FORMS.post = async f => { const d = formData(f); const doc = await myPostDoc(); doc.items.unshift({ id: uid(), t: d.t.trim(), b: d.b.trim(), ch: d.ch, at: new Date().toISOString() }); doc.items = doc.items.slice(0, 50); try { await writeMyPosts(doc); closeModal(); rerender(); toast('Járiyalandı'); } catch (e) { toast('Járiyalaw ámelge aspadı: ' + (e.message || e.code) + '. Sizde "Contributor" ruqsatı bolıwı kerek.', 'alert'); } };
ACT.postOpen = el => { const p = allPosts().find(x => x.key === el.dataset.k); if (!p) return; UI.postOpen = p.key; const rs = repliesOf(p.key); resolveNames([p.uid, ...rs.map(r => r.uid)]);
  openModal(`${modalHead(esc(p.t), `${esc(nameOf(p.uid))} · ${fmtDate(p.at.slice(0, 10))}`)}<p style="white-space:pre-wrap">${esc(p.b)}</p><div class="sep"></div><h3 style="margin-bottom:10px">Juwaplar (${rs.length})</h3>${rs.map(r => `<div class="card flat beige" style="padding:12px;margin-bottom:8px"><div class="row between"><span class="xs muted">${esc(nameOf(r.uid))} · ${fmtDate(r.at.slice(0, 10))}</span>${r.uid === CLOUD.uid || CLOUD.owner ? `<button class="fav" data-act="replyDel" data-u="${r.uid}" data-id="${r.id}">${ic('trash', 13)}</button>` : ''}</div><div class="small" style="white-space:pre-wrap">${esc(r.b)}</div></div>`).join('') || '<p class="small muted">Ele juwap joq.</p>'}
  ${CLOUD.uid ? `<form data-form="reply" class="stack" style="margin-top:10px"><input type="hidden" name="k" value="${p.key}"><textarea class="textarea" name="b" required maxlength="2000" placeholder="Juwabıńız…" style="min-height:70px"></textarea><div class="row" style="justify-content:space-between"><button type="button" class="btn sm ghost" data-act="report" data-k="${p.key}">${ic('alert', 13)} Shaǵım etiw</button><button class="btn primary sm">Juwap beriw</button></div></form>` : ''}`, true); };
FORMS.reply = async f => { const d = formData(f), doc = await myPostDoc(); doc.replies = doc.replies || []; doc.replies.push({ id: uid(), post: d.k, b: d.b.trim(), at: new Date().toISOString() }); doc.replies = doc.replies.slice(-200); try { await writeMyPosts(doc); ACT.postOpen({ dataset: { k: d.k } }); rerender(); } catch (e) { toast('Qáte: ' + (e.message || e.code), 'alert'); } };
ACT.vote = async el => { if (!CLOUD.uid) return; const doc = await myPostDoc(); doc.votes = doc.votes || {}; if (doc.votes[el.dataset.k]) delete doc.votes[el.dataset.k]; else doc.votes[el.dataset.k] = 1; try { await writeMyPosts(doc); rerender(); } catch (e) { toast('Qáte: ' + (e.message || e.code), 'alert'); } };
ACT.postDel = el => confirmBox('Post óshirilsin be?', async () => { const [u, id] = el.dataset.k.split(':'); if (u === CLOUD.uid) { const doc = await myPostDoc(); doc.items = doc.items.filter(p => p.id !== id); await writeMyPosts(doc); } else if (CLOUD.owner) { await moderate(u, d => { d.items = (d.items || []).map(p => p.id === id ? { ...p, hidden: true } : p); }); } rerender(); });
ACT.replyDel = async el => { if (el.dataset.u === CLOUD.uid) { const doc = await myPostDoc(); doc.replies = doc.replies.filter(r => r.id !== el.dataset.id); await writeMyPosts(doc); } else if (CLOUD.owner) await moderate(el.dataset.u, d => { d.replies = (d.replies || []).map(r => r.id === el.dataset.id ? { ...r, hidden: true } : r); }); closeModal(); rerender(); };
async function moderate(u, fn) { const d = SHARED.posts.find(x => x.uid === u); if (!d) return; const c = JSON.parse(JSON.stringify(d)); fn(c); const { uid: _, ...body } = c; try { await CLOUD.db.doc('posts/' + u).set(body); Object.assign(d, c); toast('Moderaciya qollanıldı', 'shield'); } catch (e) { toast('Qáte: ' + (e.message || e.code), 'alert'); } }
ACT.report = async el => { await sendFeedback({ kind: 'report', msg: 'Post shaǵımı: ' + el.dataset.k, sec: 'community' }); toast('Shaǵım moderatorǵa jiberildi', 'shield'); };
async function sendFeedback(item) { if (!CLOUD.uid) { S.feedback.push({ ...item, at: new Date().toISOString() }); save(); return 'local'; } const ref = CLOUD.db.doc('feedback/' + CLOUD.uid); let items = []; try { const s = await ref.get(); if (s.exists) items = s.data().items || []; } catch (e) {} items = items.concat([{ ...item, at: new Date().toISOString(), role: myRoles().join(',') }]).slice(-50); await ref.set({ items }); return 'sent'; }

/* ---------- isometric SVG toolkit ---------- */
const C30 = Math.cos(Math.PI / 6), S30 = .5;
const iso = (cx, cy, X, Y, Z) => [cx + (X - Y) * C30, cy + (X + Y) * S30 - Z];
const pts = a => a.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
const mix = (c, w, pct) => `color-mix(in srgb,${c} ${100 - pct}%,${w})`;
function box(cx, cy, X, Y, Z, w, d, h, c, extra = '') {

  const top = [P(X, Y, Z + h), P(X + w, Y, Z + h), P(X + w, Y + d, Z + h), P(X, Y + d, Z + h)];
  const right = [P(X + w, Y, Z), P(X + w, Y + d, Z), P(X + w, Y + d, Z + h), P(X + w, Y, Z + h)];
  const left = [P(X, Y + d, Z), P(X + w, Y + d, Z), P(X + w, Y + d, Z + h), P(X, Y + d, Z + h)];
  return `<g ${extra}><polygon points="${pts(left)}" style="fill:${mix(c, '#000', 28)}"/><polygon points="${pts(right)}" style="fill:${mix(c, '#000', 12)}"/><polygon points="${pts(top)}" style="fill:${mix(c, '#fff', 22)}"/></g>`;
}

  const foot = $('.side-foot .upgrade-card'); if (foot) foot.innerHTML = `<div class="row" style="margin-bottom:6px">${ic('shield', 16)}<b class="small">Study with IUB ilovası v${APP_VERSION}</b></div><p class="xs muted">Maǵlıwmatlar qurılmada saqlanadı${navigator.onLine ? '' : ' · oflayn rejim'}.</p>${INSTALL.ev ? `<button class="btn sm primary" style="margin-top:8px;width:100%" data-act="installApp">${ic('download', 13)} Ilovanı ornatıw</button>` : ''}`;
  if (current === 'community') { const c = $('#content .span2'); if (c && !CLOUD.uid) c.innerHTML = `<div class="card">${emptyState('Jámiyet server talap etedi', 'Postlar hám juwaplar barlıq paydalanıwshılarǵa kóriniwi ushın ortaq server kerek — bul keyingi basqıshta qosıladı. Pikirińizdi ońdaǵı forma arqalı jazıp, eksport etiwińiz múmkin.', 'users')}</div>`; }
};

/* ---- install prompt ---- */
const INSTALL = { ev: null, done: false };
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL.ev = e; rerender(); });
window.addEventListener('appinstalled', () => { INSTALL.ev = null; INSTALL.done = true; toast('Study with IUB ornatıldı!', 'check'); rerender(); });
ACT.installApp = async () => { if (!INSTALL.ev) { go('prefs'); return; } INSTALL.ev.prompt(); try { await INSTALL.ev.userChoice; } catch (e) {} INSTALL.ev = null; rerender(); };
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const _prefs = VIEWS.prefs;
VIEWS.prefs = () => _prefs() + `<div class="card" style="margin-top:16px"><div class="card-head"><h3>${ic('download', 15)} Ilovanı telefonǵa yamasa kompyuterge ornatıw</h3>${isStandalone() ? '<span class="pill green">Ornatılǵan</span>' : INSTALL.ev ? `<button class="btn primary" data-act="installApp">${ic('download', 15)} Ornatıw</button>` : ''}</div>
  <div class="grid g3"><div class="card flat beige"><b class="small">Android (Chrome)</b><p class="xs muted" style="margin-top:4px">Menyu (⋮) → "Ilovanı ornatıw" yamasa "Bas ekranǵa qosıw".</p></div><div class="card flat beige"><b class="small">iPhone (Safari)</b><p class="xs muted" style="margin-top:4px">"Bólisiw" túymesi → "Bas ekranǵa qosıw" (Add to Home Screen).</p></div><div class="card flat beige"><b class="small">Kompyuter (Chrome / Edge)</b><p class="xs muted" style="margin-top:4px">Mánzil qatarınıń ońındaǵı ornatıw belgisin basıń.</p></div></div>
  <p class="xs muted" style="margin-top:10px">Ornatılǵannan keyin ilova bólek aynada ashıladı hám internetsiz de isleydi. Versiya: ${APP_VERSION}</p></div>`;

/* ---- service worker (offline) + persistent storage ---- */
if (APP_MODE && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Jańa versiya tayar — betti jańalań', 'reset'); }); });
    }).catch(() => {});
  });
}
if (APP_MODE && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
window.addEventListener('online', () => { toast('Internet qayta tiklendi', 'globe'); rerender(); });
window.addEventListener('offline', () => { toast('Oflayn rejim — maǵlıwmatlar qurılmada saqlanıp turadı', 'info'); rerender(); });
/* ============ init (runs after every module is defined) ============ */
load();
if (!S.roles || !S.roles.length) S.roles = [S.role];
{ const h = location.hash.slice(1); current = VIEWS[h] ? h : 'dashboard'; }
render();
initCloud();

</script>
</body>
